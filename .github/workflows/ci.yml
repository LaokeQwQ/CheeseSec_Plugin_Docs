name: handbook-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No write token or deployment credential is needed for documentation CI.
permissions: {}

concurrency:
  group: handbook-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-linux.txt

      - name: Check workflow policy
        run: python scripts/check_workflow_policy.py

      - name: Install pinned validation dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --require-hashes --only-binary=:all:
          --requirement requirements-ci-linux.txt

      - name: Validate CRP v1 schema and examples
        run: python scripts/validate_crp_v1.py

      - name: Validate handbook links and required bilingual pages
        run: python scripts/validate_docs.py

      - name: Scan repository files for secrets and release artifacts
        run: python scripts/secret_scan.py

      - name: Check repository whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- ':!LICENSE'; then
            echo 'trailing whitespace found' >&2
            exit 1
          fi
